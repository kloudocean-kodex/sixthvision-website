name: TEMP Generate Residential Entity Truth

on:
  push:
    branches:
      - growthproof/residential-entity-truth-clean-20260912

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proof branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate entity-safe page
        run: python3 scripts/apply_search_ai_identity.py

      - name: Prove retired geo is absent
        run: |
          ! grep -F -- '-37.745313' index.html
          ! grep -F -- '144.99953' index.html
          grep -F '"addressLocality": "Melbourne"' index.html
          grep -F '"areaServed": { "@type": "City", "name": "Melbourne" }' index.html
          git diff --check

      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated page change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "GrowthProof: generate Residential entity-safe output"
          git push origin HEAD:${{ github.ref_name }}
